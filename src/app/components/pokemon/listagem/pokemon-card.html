<a class="pokemon-card" [style.--type-color]="cor()" [routerLink]="['/pokemon', pokemon().name]">
  <div class="pokemon-card__header">
    <div>
      <h2>{{ nome() }}</h2>
      <div class="pokemon-card__types">
        @for (tipo of tipos(); track tipo.name) {
          <span [style.background-color]="tipo.color">{{ tipo.displayName }}</span>
        }
      </div>
    </div>
    <span class="pokemon-card__number">#{{ numero() }}</span>
  </div>
  <div class="pokemon-card__visual">
    @if (imagem(); as url) {
      <img
        class="card-image"
        [src]="url"
        [alt]="'Imagem de ' + nome()"
        loading="lazy"
        width="160"
        height="160"
      />
    } @else {
      <p>Imagem não disponível</p>
    }
  </div>
  <svg class="pokemon-card__watermark" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="45" />
    <circle cx="50" cy="50" r="14" />
    <path d="M5 50h31M64 50h31" />
  </svg>
</a>
