<nav class="navbar" aria-label="Navegação principal">
  <div class="navbar-layout">
    <a class="navbar-brand" routerLink="/pokemon" (click)="fecharMenu()">
      <svg viewBox="0 0 100 100" class="navbar-brand-icon" aria-hidden="true">
        <circle cx="50" cy="50" r="45" fill="white" stroke="#121212" stroke-width="4" />
        <path d="M5 50 A45 45 0 0 1 95 50Z" fill="#e3350d" stroke="#121212" stroke-width="4" />
        <path d="M5 50h31M64 50h31" stroke="#121212" stroke-width="4" />
        <circle cx="50" cy="50" r="14" fill="white" stroke="#121212" stroke-width="4" />
        <circle cx="50" cy="50" r="5" fill="#121212" />
      </svg>
      <span>Pokédex</span>
    </a>
    <form class="pokemon-search__form" role="search" (ngSubmit)="pesquisar()">
      <label class="visually-hidden" for="pokemon-search">Nome completo ou número do Pokémon</label>
      <div class="pokemon-search__input">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input
          id="pokemon-search"
          name="pokemon"
          type="search"
          placeholder="Pesquise por nome ou número…"
          autocomplete="off"
          [ngModel]="pesquisa.textoPesquisa()"
          (ngModelChange)="pesquisa.textoPesquisa.set($event)"
        />
      </div>
      <button type="submit" class="search-button">Pesquisar</button>
      @if (pesquisa.resultado().termo || pesquisa.textoPesquisa()) {
        <button
          type="button"
          class="clear-button"
          (click)="limparPesquisa()"
          aria-label="Limpar pesquisa"
          title="Limpar pesquisa"
        >
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      }
    </form>
    <a class="navbar-home" routerLink="/pokemon" (click)="fecharMenu()">Início</a>
  </div>
</nav>
